
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 100 100">
<defs>
<g id="Layer1_0_FILL">
<!-- True circular outer body -->
<circle cx="50" cy="50" r="42.2" fill="#4E4E4E" stroke="none"/>

<!-- True circular inner body; enlarged so the exposed rectangular notches are ~half their prior radial length -->
<circle cx="50" cy="50" r="33.925" fill="#4E4E4E" stroke="none"/>

<!-- Four narrow rectangular directional notches; clipped geometrically to stop at the outer edge of the inner-circle stroke -->
<rect x="48.65" y="9.55" width="2.7" height="5.85" fill="#272727" stroke="none"/>
<rect x="84.6" y="48.65" width="5.85" height="2.7" fill="#272727" stroke="none"/>
<rect x="48.65" y="84.6" width="2.7" height="5.85" fill="#272727" stroke="none"/>
<rect x="9.55" y="48.65" width="5.85" height="2.7" fill="#272727" stroke="none"/>

<!-- Thin inner-circle outline: half the 2.7-unit notch width, matching the outer ring -->
<circle cx="50" cy="50" r="33.925" fill="none" stroke="#272727" stroke-width="1.35"/>

<!-- Center mark -->
<path fill="#8C8C8C" stroke="none" d="
M 49 37.7
L 43.55 37.7 43.55 62.5 59.1 62.5 59.1 57.45 49 57.45 49 37.7 Z"/>
</g>

<circle id="Layer1_0_1_STROKES" cx="50" cy="50" r="42.2" stroke="#151515" stroke-width="4" fill="none"/>

</defs>

<g transform="matrix( 1, 0, 0, 1, 0,0) ">
<use xlink:href="#Layer1_0_FILL"/>

<use xlink:href="#Layer1_0_1_STROKES"/>
</g>

</svg>
