    <circle cx="12" cy="12" r="9" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="12" cy="8" r="1.25" fill="black"/>
    <rect x="11" y="10.5" width="2" height="6.5" rx="0.35" fill="black"/>
  </g>
</svg>
